name: Build SPECTRA Portable Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download SpiderFoot
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/smicallef/spiderfoot/archive/refs/tags/v4.0.zip" -OutFile spiderfoot.zip
          Expand-Archive spiderfoot.zip -DestinationPath vendor
          New-Item -ItemType Directory -Force -Path tools\spiderfoot | Out-Null
          Copy-Item vendor\spiderfoot-4.0\* tools\spiderfoot\ -Recurse -Force

      - name: Build bundled SpiderFoot Python runtime
        shell: pwsh
        run: |
          python -m venv tools\spiderfoot\runtime
          tools\spiderfoot\runtime\Scripts\python.exe -m pip install --upgrade pip
          tools\spiderfoot\runtime\Scripts\python.exe -m pip install "Cython<3" "PyYAML==6.0.1"
          tools\spiderfoot\runtime\Scripts\python.exe -m pip install -r tools\spiderfoot\requirements.txt
          Move-Item tools\spiderfoot\runtime\Scripts\python.exe tools\spiderfoot\runtime\python.exe
          Copy-Item tools\spiderfoot\runtime\Scripts\pythonw.exe tools\spiderfoot\runtime\pythonw.exe -ErrorAction SilentlyContinue

      - name: Build portable GUI
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --name SPECTRA run_spectra.pyw

      - name: Prepare portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable\SPECTRA\config | Out-Null
          New-Item -ItemType Directory -Force -Path portable\SPECTRA\data | Out-Null
          New-Item -ItemType Directory -Force -Path portable\SPECTRA\reports | Out-Null
          New-Item -ItemType Directory -Force -Path portable\SPECTRA\tools | Out-Null
          Copy-Item dist\SPECTRA\* portable\SPECTRA\ -Recurse -Force
          Copy-Item config\settings.example.json portable\SPECTRA\config\settings.example.json -Force
          Copy-Item README.txt portable\SPECTRA\README.txt -Force
          Copy-Item tools\spiderfoot portable\SPECTRA\tools\spiderfoot -Recurse -Force

      - name: Upload SPECTRA portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-Windows-Portable
          path: portable\SPECTRA
          if-no-files-found: error
