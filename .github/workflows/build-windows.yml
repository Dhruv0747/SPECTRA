name: Build SPECTRA Portable Windows
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-spiderfoot.lock
      - name: Install build requirements
        run: python -m pip install -r requirements-build.txt
      - name: Test, package and verify GUI and bundled engine
        run: python scripts/build_windows.py
      - name: Upload verified portable package
        uses: actions/upload-artifact@v4
        with:
          name: SPECTRA-Windows-Portable
          path: |
            dist/SPECTRA-Windows-Portable.zip
            dist/SPECTRA-Windows-Portable.zip.sha256
          if-no-files-found: error
